apiVersion: apps/v1
kind: Deployment
metadata:
  name: ignore-array-order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ignore-array-order
  template:
    metadata:
      labels:
        app: ignore-array-order
    spec:
      containers:
        - name: app
          image: nginx:1.27
          args:
            - --second
            - --first
          env:
            - name: DB_PORT
              value: "5433"
            - name: LOG_LEVEL
              value: info
            - name: DB_HOST
              value: postgres
          volumeMounts:
            - name: config
              mountPath: /etc/config
            - name: cache
              mountPath: /var/cache
      volumes:
        - name: cache
          emptyDir: {}
        - name: config
          emptyDir: {}
